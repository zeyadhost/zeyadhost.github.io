name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: node build.mjs
        env:
          SITE_URL: https://zeyad.is-a.dev

      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html 404.html style.css icons.css main.js feed.xml favicon.ico favicon.svg apple-touch-icon.png preview.png blog fonts media _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
